apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamingapp.fullname" . }}-streaming
  labels:
    {{- include "streamingapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: streaming
spec:
  replicas: {{ .Values.streaming.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "streamingapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: streaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "streamingapp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: streaming
    spec:
      containers:
        - name: streaming
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.streaming.image.repository }}:{{ .Values.streaming.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.streaming.service.targetPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.streaming.resources | nindent 12 }}

          env:
            - name: PORT
              value: "{{ .Values.streaming.service.targetPort }}"

            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: MONGO_URI

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-secret
                  key: JWT_SECRET

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "streamingapp.fullname" . }}-config
                  key: CLIENT_URLS

          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20